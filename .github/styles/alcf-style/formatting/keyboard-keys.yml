extends: existence
level: warning
message: "Please use '++key++' syntax for keyboard keys (e.g., '++ctrl+c++' instead of 'Ctrl+C')."
scope: raw
nonword: true
tokens:
  - '(?<![+\w])(?i:Ctrl|Alt|Shift|Cmd|Enter|Esc|Delete|Backspace)(?:[ \t]?\+[ \t]?|-)[A-Za-z0-9](?!\+)'
tests:
  - name: flags old key syntax
    input: "Press Ctrl+C"
    want: |
      1:7:alcf-style.formatting.keyboard-keys:Please use '++key++' syntax for keyboard keys (e.g., '++ctrl+c++' instead of 'Ctrl+C').
  - name: allows new key syntax
    input: "Press ++ctrl+c++"
    want: ''
  - name: ignores key names inside other words
    input: "See the data-center-gpu page and the XALT-related notes."
    want: ''
  - name: ignores command-line flags after enter
    input: "To list fields, enter -f? or -w?."
    want: ''

