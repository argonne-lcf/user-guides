extends: existence
level: warning
message: "Please use 'bash' instead of 'sh'."
scope: sentence
nonword: false
tokens:
  - sh
tests:
  - name: flags sh
    input: "The shell script sh is used."
    want: |
      1:18:alcf-style.terminology.shell-bash:Please use 'bash' instead of 'sh'.
  - name: allows shell
    input: "The shell script is used."
    want: ''
  - name: allows bash
    input: "Use bash for scripts."
    want: ''
  - name: ignores sh in code block
    input: "```bash\n#!/bin/sh\n```"
    want: ''
