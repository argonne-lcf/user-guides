extends: metric
level: error
message: "More than one # H1 heading present."
formula: heading.h1
condition: "> 1.0"
tests:
  - name: flags multiple H1s
    input: |
      # First H1
      Some text
      # Second H1
    contains:
      - alcf-style.structure.single-h1
  - name: allows single H1
    input: |
      # Only H1
      Some text
      ## H2
    want: ''
  - name: ignores comments in code blocks
    input: |
      # Only H1

      Some text.

      ```bash
      # load modules
      module load frameworks
      ```
    want: ''

