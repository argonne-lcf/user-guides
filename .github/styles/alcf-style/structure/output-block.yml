extends: existence
level: warning
message: "Sample output should be in a separate block with the class '{ .output .no-copy }'."
scope: raw
nonword: true
tokens:
  - '(?m)^[ \t]*`{3,}(?![^\r\n]*\.(?:output|no-copy)\b)[^\r\n]*\r?\n[ \t]*(?:[a-zA-Z0-9._/-]+@[a-zA-Z0-9._/-]+[: \t][^\r\n]*[$#]|\$[ \t]+)'
tests:
  - name: flags missing output class
    input: |
      ```
      user@host:~$ ls
      file1
      ```
    want: |
      1:1:alcf-style.structure.output-block:Sample output should be in a separate block with the class '{ .output .no-copy }'.
  - name: allows output class
    input: |
      ```{.output .no-copy}
      user@host:~$ ls
      file1
      ```
    want: ''
  - name: flags root prompt missing class
    input: |
      ```
      root@host:~# ls
      file1
      ```
    want: |
      1:1:alcf-style.structure.output-block:Sample output should be in a separate block with the class '{ .output .no-copy }'.
  - name: ignores standard code block
    input: |
      ```bash
      ls -la
      ```
    want: ''
  - name: ignores plain text
    input: |
      This is just some text.
    want: ''
