extends: existence
level: error
message: "Use an approved placeholder: <username>, <project>, <jobid>, <queue>, <path>, or <name>."
nonword: true
scope: raw
tokens:
  - '<(?!(?:username|project|jobid|queue|path|name)>)[a-z][a-z0-9_-]*>'
tests:
  - name: flags unapproved placeholder
    input: "Enter <my_var> here."
    want: |
      1:7:ALCF_Style.placeholders.approved-placeholders:Use an approved placeholder: <username>, <project>, <jobid>, <queue>, <path>, or <name>.
  - name: allows approved placeholder
    input: "Enter <name> here."
    want: ''
