name: mkdocs-build
on:
  # push:
  #   branches:
  #     - main
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  docs-strict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          activate-environment: true
          python-version: "3.13"
          enable-cache: true
      - name: Install dependencies
        run: uv pip install -r requirements.txt
      - name: Cache external assets downloaded by the privacy plugin
        uses: actions/cache@v6
        with:
          path: .cache/plugin/privacy
          key: privacy-${{ hashFiles('mkdocs.yml') }}
          restore-keys: privacy-
      - name: Build docs with --strict
        run: make build-docs
