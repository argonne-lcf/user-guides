name: update-livesite
on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual triggering

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          activate-environment: true
          python-version: "3.13"
          enable-cache: true
      - name: Install dependencies
        run: uv pip install -r requirements.txt
      - name: Install pngquant (required by the optimize plugin)
        run: sudo apt-get update && sudo apt-get install -y pngquant
      - name: Cache assets fetched/generated by the privacy and optimize plugins
        uses: actions/cache@v6
        with:
          path: .cache/plugin
          key: mkdocs-plugins-${{ hashFiles('mkdocs.yml') }}
          restore-keys: mkdocs-plugins-
      - run: mkdocs gh-deploy --force --strict
