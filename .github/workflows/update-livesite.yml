name: update-livesite
on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: write

concurrency: update-livesite

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          activate-environment: true
          python-version: "3.13"
          enable-cache: true
      - name: Install dependencies
        run: uv pip install -r requirements.txt
      - name: Install pngquant (required by the optimize plugin)
        run: sudo apt-get update && sudo apt-get install -y pngquant
      - name: Cache assets fetched/generated by the privacy and optimize plugins
        uses: actions/cache@v6
        with:
          path: .cache/plugin
          key: mkdocs-plugins-${{ hashFiles('mkdocs.yml') }}
          restore-keys: mkdocs-plugins-
      - run: mkdocs build --strict
      # mkdocs gh-deploy used to add .nojekyll on gh-pages; mkdocs build
      # does not emit it, so recreate it to keep Jekyll disabled.
      - run: touch site/.nojekyll
      - name: Deploy to gh-pages, preserving PR previews
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
          branch: gh-pages
          clean-exclude: pr-preview/
          single-commit: true
