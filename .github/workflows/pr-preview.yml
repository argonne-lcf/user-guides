name: pr-preview
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

# Queue (not cancel) per-PR so an in-flight teardown is never killed
concurrency: preview-${{ github.ref }}

# This repo's Pages site serves only the production artifact (update-livesite),
# so previews are pushed to the gh-pages branch of a separate repo, using the
# PREVIEW_DEPLOY_TOKEN secret (contents: write on that repo only). The sticky
# comment on this PR uses GITHUB_TOKEN.
permissions:
  contents: read
  pull-requests: write   # sticky comment

jobs:
  preview:
    runs-on: ubuntu-latest
    # Same-repo branch PRs only: fork PRs get no secrets.
    # head.repo is populated on 'closed' too, so cleanup still runs.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          # Submodules only needed to build; skip for teardown-only runs
          submodules: ${{ github.event.action != 'closed' && 'recursive' || 'false' }}
      - name: Install uv
        if: github.event.action != 'closed'
        uses: astral-sh/setup-uv@v10.2.0
        with:
          activate-environment: true
          python-version: "3.13"
          enable-cache: true
      - name: Install dependencies
        if: github.event.action != 'closed'
        run: uv pip install -r requirements.txt
      - name: Install pngquant (optimize plugin, social card compression) and Cairo (social plugin)
        if: github.event.action != 'closed'
        run: sudo apt-get update && sudo apt-get install -y pngquant libcairo2
      - name: Cache assets fetched/generated by the privacy, optimize, and social plugins
        if: github.event.action != 'closed'
        uses: actions/cache@v6
        with:
          path: .cache/plugin
          key: mkdocs-plugins-${{ hashFiles('mkdocs.yml', 'layouts/**') }}
          restore-keys: mkdocs-plugins-
      - name: Build docs with --strict
        if: github.event.action != 'closed'
        run: make build-docs
      - name: Discourage search indexing of previews
        if: github.event.action != 'closed'
        run: find site -name '*.html' -exec sed -i 's|<head>|<head><meta name="robots" content="noindex">|' {} +
      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1.8.1
        with:
          source-dir: site
          deploy-repository: argonne-lcf/user-guides-previews
          token: ${{ secrets.PREVIEW_DEPLOY_TOKEN }}
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          pages-base-url: argonne-lcf.github.io/user-guides-previews
