name: pr-preview
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled, closed]

# Queue (not cancel) per-PR so an in-flight teardown is never killed. Key on
# the PR number: on a merged 'closed' event github.ref is the base branch.
# Events that do nothing get their own group: GitHub keeps one pending run per
# group, and a no-op run would otherwise replace a pending deploy or removal.
# No-ops are labels on a closed PR and, except adding no-preview (which also
# removes the preview a PR keeps when converted back to draft), pushes to a
# draft, other labels, and anything on a PR with no-preview.
concurrency: preview-${{ github.event.pull_request.number }}${{ github.event.action != 'closed' && (github.event.pull_request.state != 'open' || (!(github.event.action == 'labeled' && github.event.label.name == 'no-preview') && (github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'no-preview') || ((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'preview-social-cards' && github.event.label.name != 'no-preview')))) && '-noop' || '' }}

# This repo's Pages site serves only the production artifact (update-livesite),
# so previews are pushed to the gh-pages branch of a separate repo. Only the
# build job runs PR code, with a read-only token and no secrets. The jobs that
# get PREVIEW_DEPLOY_TOKEN (Contents read/write on the previews repo only) or
# pull-requests: write run on separate runners and never check out PR code.
permissions: {}

env:
  PREVIEW_REPO: argonne-lcf/user-guides-previews
  PREVIEW_DIR: pr-preview/pr-${{ github.event.pull_request.number }}
  PREVIEW_URL: https://argonne-lcf.github.io/user-guides-previews/pr-preview/pr-${{ github.event.pull_request.number }}/

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      build: ${{ steps.decide.outputs.build }}
      remove: ${{ steps.decide.outputs.remove }}
      cards: ${{ steps.decide.outputs.cards }}
    steps:
      - id: decide
        env:
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          EVENT: ${{ github.event.action }}
          STATE: ${{ github.event.pull_request.state }}
          DRAFT: ${{ github.event.pull_request.draft }}
          LABEL: ${{ github.event.label.name }}
          CARDS: ${{ contains(github.event.pull_request.labels.*.name, 'preview-social-cards') }}
          NO_PREVIEW: ${{ contains(github.event.pull_request.labels.*.name, 'no-preview') }}
        run: |
          # Same-repo branch PRs only (fork PRs get no secrets); drafts get a
          # preview once marked ready; the no-preview label skips previews,
          # and adding it removes an existing one (also from a PR converted
          # back to draft, which keeps its preview); of label changes, only
          # preview-social-cards and no-preview rebuild, and not on a closed PR.
          build=false remove=false
          if [ "$SAME_REPO" = true ]; then
            if [ "$EVENT" = closed ]; then
              remove=true
            elif [ "$STATE" != open ]; then
              :
            elif [ "$NO_PREVIEW" = true ]; then
              [ "$EVENT" = labeled ] && [ "$LABEL" = no-preview ] && remove=true
            elif [ "$DRAFT" = true ]; then
              :
            elif [ "$EVENT" = labeled ] || [ "$EVENT" = unlabeled ]; then
              case "$LABEL" in preview-social-cards|no-preview) build=true ;; esac
            else
              build=true
            fi
          fi
          echo "build=$build remove=$remove cards=$CARDS"
          { echo "build=$build"; echo "remove=$remove"; echo "cards=$CARDS"; } >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          activate-environment: true
          python-version: "3.13"
          enable-cache: true
      - name: Install dependencies
        run: uv pip install -r requirements.txt segno==1.6.6
      - name: Install pngquant (optimize plugin, social card compression) and Cairo (social plugin)
        run: sudo apt-get update && sudo apt-get install -y pngquant libcairo2
      - name: Cache assets fetched/generated by the privacy, optimize, and social plugins
        uses: actions/cache@v6
        with:
          path: .cache/plugin
          # Own key prefix: this build usually has no social cards, so
          # mkdocs-build (docs-strict) must not restore its cache.
          key: preview-mkdocs-plugins-${{ hashFiles('mkdocs.yml', 'layouts/**') }}
          restore-keys: |
            preview-mkdocs-plugins-
            mkdocs-plugins-
      - name: Build docs with --strict
        env:
          CARDS: ${{ needs.gate.outputs.cards }}
        run: |
          if [ "$CARDS" = true ]; then
            # preview-social-cards label: build the cards, and point og:image
            # (and canonical URLs) at the preview instead of production.
            export SITE_URL="$PREVIEW_URL"
          else
            # og:image points at production, so the cards would be unused;
            # they are over half of a preview's size.
            export SOCIAL_CARDS=false
          fi
          make build-docs
      - name: Mark pages noindex, record the commit, and make the comment's QR code
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          find site -name '*.html' -exec sed -i 's|<head>|<head><meta name="robots" content="noindex">|' {} +
          echo "$SHA" > site/preview-commit.txt
          python -c 'import os, segno; segno.make(os.environ["PREVIEW_URL"], error="m").save("site/preview-qr.svg", scale=4, border=2, dark="#000", light="#fff")'
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: site/
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site
      - name: Initialize an empty git repo
        # The deploy action configures git in the workspace and adds a
        # worktree from HEAD, so HEAD needs a commit.
        run: |
          git init -q
          git -c user.name=pr-preview -c user.email=pr-preview@localhost commit -q --allow-empty -m init
      - name: Push the preview to the previews repo
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          token: ${{ secrets.PREVIEW_DEPLOY_TOKEN }}
          repository-name: ${{ env.PREVIEW_REPO }}
          branch: gh-pages
          folder: site
          target-folder: ${{ env.PREVIEW_DIR }}
          # Never force-push: all previews share the branch. A rejected push
          # is rebased and retried, and each PR writes only its own folder.
          force: false
          attempt-limit: 10
          git-config-name: pr-preview
          git-config-email: pr-preview@localhost
          commit-message: Deploy preview of ${{ github.repository }}#${{ github.event.pull_request.number }} at ${{ github.event.pull_request.head.sha }}
      - name: Wait for GitHub Pages to serve this commit
        # The push succeeds even when the Pages build then fails (e.g. over
        # the 1 GB site limit), so check the live site.
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for i in $(seq 40); do
            [ "$(curl -fsS "${PREVIEW_URL}preview-commit.txt?$SHA-$i" 2>/dev/null)" = "$SHA" ] && exit 0
            sleep 15
          done
          echo "::error::$PREVIEW_URL is not serving $SHA after 10 minutes; check the Pages builds in $PREVIEW_REPO."
          exit 1

  remove:
    needs: gate
    if: needs.gate.outputs.remove == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Initialize an empty git repo and an empty folder
        run: |
          git init -q
          git -c user.name=pr-preview -c user.email=pr-preview@localhost commit -q --allow-empty -m init
          mkdir "$RUNNER_TEMP/empty"
      - name: Remove the preview from the previews repo
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          token: ${{ secrets.PREVIEW_DEPLOY_TOKEN }}
          repository-name: ${{ env.PREVIEW_REPO }}
          branch: gh-pages
          folder: ${{ runner.temp }}/empty
          target-folder: ${{ env.PREVIEW_DIR }}
          force: false
          attempt-limit: 10
          git-config-name: pr-preview
          git-config-email: pr-preview@localhost
          commit-message: Remove preview of ${{ github.repository }}#${{ github.event.pull_request.number }}

  comment:
    needs: [gate, build, deploy, remove]
    if: ${{ !cancelled() && (needs.gate.outputs.build == 'true' || needs.gate.outputs.remove == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post or update the preview comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          EVENT: ${{ github.event.action }}
          REMOVING: ${{ needs.gate.outputs.remove }}
          CARDS: ${{ needs.gate.outputs.cards }}
          DEPLOY: ${{ needs.deploy.result }}
          REMOVE: ${{ needs.remove.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # A one-column table, styled after rossjrw/pr-preview-action's comment.
          now=$(date -u '+%Y-%m-%d %H:%M UTC')
          title="[PR preview](https://github.com/$REPO/blob/main/.github/workflows/pr-preview.yml)"
          branch="branch [\`gh-pages\`](https://github.com/$PREVIEW_REPO/tree/gh-pages)"
          if [ "$REMOVING" = true ]; then
            reason="this PR was closed"
            [ "$EVENT" = closed ] || reason="the \`no-preview\` label was added"
            if [ "$REMOVE" = success ]; then
              main=":wastebasket: Preview removed because $reason."
              foot="Removed from $branch at $now."
            else
              main=":warning: Removing the preview [failed]($RUN_URL)."
              foot="Its folder may remain on $branch."
            fi
          elif [ "$DEPLOY" = success ]; then
            cards=""
            [ "$CARDS" = true ] && cards=", with social cards,"
            main="<p><img src=\"${PREVIEW_URL}preview-qr.svg\" height=\"100\" align=\"right\" alt=\"QR code for the preview link\"></p> :rocket: View preview at <br> $PREVIEW_URL"
            foot="Built from \`${SHA::7}\`$cards to $branch at $now. <br> Updated on every push; removed when the PR closes."
          else
            main=":warning: Preview not updated for \`${SHA::7}\`: the [preview run]($RUN_URL) failed. <br> The last successful build, if any, is at <br> $PREVIEW_URL"
            foot="Checked at $now."
          fi
          body=$(printf '%s\n:---:\n| %s <br><br>\n| <h6>%s <br><br> </h6>\n\n<!-- pr-preview -->\n' "$title" "$main" "$foot")
          # Also matches the comment left by rossjrw/pr-preview-action, which
          # this workflow used before ("<!-- Sticky Pull Request Commentpr-preview -->").
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("pr-preview -->"))) | .id' | head -n 1)
          if [ -z "$id" ] && [ "$REMOVING" = true ]; then
            exit 0  # never had a preview comment, e.g. opened before this workflow existed or with no-preview
          elif [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null
          fi
