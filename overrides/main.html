{% extends "base.html" %}

{% block extrahead %}
{%- if page.meta and page.meta.robots %}
<meta name="robots" content="{{ page.meta.robots }}">
{%- endif %}
<link rel="stylesheet" href="https://use.typekit.net/pxo0nvo.css">
<link rel="apple-touch-icon" href="{{ 'images/apple-touch-icon.png' | url }}">
<!-- AskALCF widget: base URL of the agent API, deployed at
     https://ask.alcf.anl.gov (only /v1/agent/chat is public).
     The live docs site and local previews (`mkdocs serve` on localhost or
     127.0.0.1, port 8000) both use it: the API allows those origins.
     To develop against a local API, point this at http://localhost:8080.
     Any other host falls back to the widget's JS default, localhost:8080. -->
<script>
  if (location.hostname === "docs.alcf.anl.gov" ||
      location.hostname === "localhost" || location.hostname === "127.0.0.1") {
    window.ASKALCF_API_BASE = "https://ask.alcf.anl.gov";
  }
</script>
{% endblock %}
