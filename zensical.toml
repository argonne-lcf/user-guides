]

# Link-preview cards (Open Graph/Twitter tags plus a PNG per page). Always on:
# without !ENV, CI=true and SOCIAL_CARDS=false can no longer switch it, so local
# builds and PR previews generate cards too. Card design (logo, colors, font)
# is in layouts/alcf.yml.
[project.plugins.social]
cards_layout = "alcf"

# Replaces MkDocs' exclude_docs and draft_docs. `*` also matches "/"; `**/`
# matches any depth, including none.
[project.plugins.exclude]
glob = [
  "**/unused/*",
  "**/old/*",
  "**/drafts/*",
  "**/todo.md",
  "**/TODO.md",
  "**/notes.md",
  # TODO: complete or remove Aurora placeholder pages
  "aurora/compiling-and-linking/llvm-compilers-aurora.md",
  "aurora/compiling-and-linking/gnu-compilers-aurora.md",
  "aurora/compiling-and-linking/cce-compilers-aurora.md",
  "aurora/applications-and-libraries/libraries/math-libraries.md",
  "aurora/applications-and-libraries/libraries/mkl.md",
  "aurora/applications-and-libraries/libraries/mpi.md",
  "aurora/performance-tools/performance-overview.md",
]

