# Site configuration for Zensical. Every key under [project] has to come before
# the first [project.*] table, so the nav is near the top.

[project]
site_name = "ALCF User Guides"
site_description = "How to use the Argonne Leadership Computing Facility's computing resources: accounts, jobs, data, and software."
site_author = "Argonne Leadership Computing Facility"
repo_name = "argonne-lcf/user-guides"
repo_url = "https://github.com/argonne-lcf/user-guides"
# Fixed: zensical.toml has no equivalent of mkdocs.yml's !ENV, so SITE_URL can
# no longer override it (PR previews labeled preview-social-cards used that).
site_url = "https://docs.alcf.anl.gov/"
edit_uri = "edit/main/docs/"

extra_css = ["stylesheets/alcf-extra.css"]

extra_javascript = [
  "javascripts/alcf-extra.js",
  "https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js",
  "https://unpkg.com/tablesort@5.3.0/dist/sorts/tablesort.date.min.js",
  "https://unpkg.com/tablesort@5.3.0/dist/sorts/tablesort.number.min.js",
  "https://unpkg.com/tablesort@5.3.0/dist/sorts/tablesort.filesize.min.js",
  "https://unpkg.com/tablesort@5.3.0/dist/sorts/tablesort.dotsep.min.js",
  "javascripts/tablesort.js",
  # Loads the MathJax bundle itself, only on pages with math.
  "javascripts/mathjax.js",
]

# Pages that are not in navigation but still built
# Zensical ignores not_in_nav and has no check for pages missing from nav, so
# `zensical build --strict` passes even when a new page isn't in nav or listed
# here. Kept as the list of pages meant to be reachable only by links.
not_in_nav = """
not_in_nav/
index.md
inbound-links.md
aurora/bugs-table.md
"""

