      { "Data Policy" = "policies/data-and-software-policies/data-policy.md" },
      { "Software Policy" = "policies/data-and-software-policies/software-policy.md" },
    ] },
  ] },
  { "Acronyms" = "acronyms.md" },
  { "Tags" = "tags.md" },
]

[project.theme]
# Keep Material for MkDocs' look (custom CSS depends on it).
variant = "classic"
custom_dir = "overrides"
language = "en"
logo = "images/logo.svg"
favicon = "images/favicon.svg"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.copy",
  "content.code.annotate",
  "content.tooltips",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.code.select",
  # "navigation.expand",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.instant.prefetch",
  # "navigation.instant.preview",  # previews every internal link; see zensical.extensions.preview below
  "navigation.path",
  "navigation.prune",  # for sites with 100s or 1k pages; only render visible navbar items (i.e. clicking on collapsed sections will navigate to the first page in that section, since it isnt rendered)
  # "navigation.tabs",  # for non-mobile browsers, move top-level sections from left nav sidebar to top under header
  "navigation.top",
  "navigation.tracking",
  "navigation.sections",
  "toc.follow",
  # "toc.integrate",  # move right-side intra-page TOC within left nav sidebar
  "search.highlight",
  # Not implemented by Zensical's search:
  # "search.suggest",
  # "search.share",
]

[project.theme.font]
# Sets --md-text-font, the only thing applying Proxima Nova (no CSS
# font-family); the font itself comes from the Adobe Fonts kit in
# overrides/main.html. Material also adds this name to its Google Fonts
# request, but Google has no such family, so only the code font (Roboto
# Mono) is fetched. Removing this falls back to Roboto.
text = "proxima-nova"

# Palette toggle for automatic mode
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "material/brightness-auto"
toggle.name = "Switch to light mode"

# Palette toggle for light mode
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "alcf"
primary = "custom"
accent = "custom"
toggle.icon = "material/weather-sunny"
toggle.name = "Switch to dark mode"

# Palette toggle for dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "material/weather-night"
toggle.name = "Switch to system preference"

# Zensical moves every pymdownx.* entry after the others, then
# zensical.extensions.*, so the order here differs from mkdocs.yml.
[project.markdown_extensions]
footnotes = {}
tables = {}
attr_list = {}
md_in_html = {}
abbr = {}
toc.permalink = true
pymdownx.critic = {}
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
# Google Material Symbols, vendored; not bundled with the theme,
# whose `material` namespace is Pictogrammers MDI. See the README there.
pymdownx.emoji.options.custom_icons = ["overrides/.icons"]
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.caret = {}
pymdownx.mark = {}
pymdownx.tilde = {}
pymdownx.snippets.base_path = ["."]  # for root of repo, default since that is where the config file is
pymdownx.snippets.dedent_subsections = true  # experimental; new in 9.10 (2023-03-05)
pymdownx.snippets.check_paths = true
pymdownx.snippets.url_download = true
pymdownx.snippets.auto_append = ["includes/abbreviations.md"]
pymdownx.superfences = {}
pymdownx.highlight.use_pygments = true
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.arithmatex.generic = true
pymdownx.betterem.smart_enable = "all"
# Autolinks bare URLs only. repo_url_shorthand/social_url_shorthand are OFF:
# prose here uses "see note #1" and "@alcf", which they turn into bogus
# links to github issues/users.
pymdownx.magiclink.repo_url_shorthand = false
pymdownx.magiclink.social_url_shorthand = false
pymdownx.escapeall = {}
pymdownx.fancylists = {}
pymdownx.bracketspan = {}
# Requires a space after '#' for headings; guards against unfenced '#PBS'/'#!' lines.
pymdownx.saneheaders = {}
# Material's admonition types; blocks.admonition defaults to a shorter list.
pymdownx.blocks.admonition.types = ["note", "abstract", "info", "tip", "success", "question", "warning", "failure", "danger", "bug", "example", "quote"]
pymdownx.blocks.details = {}
pymdownx.blocks.tab.alternate_style = true
pymdownx.blocks.html = {}
pymdownx.blocks.definition = {}
pymdownx.blocks.caption = {}
# Instant previews: hover cards only for links to these reference pages
# (short pages, or pages usually linked at a section such as the queue
# tables). Patterns are globs; "*" also matches "/". Don't enable the
# navigation.instant.preview theme feature: it previews every internal
# link, regardless of these targets.
zensical.extensions.preview.sources.exclude = [
  "index.md",  # no previews on the home page tiles
]
zensical.extensions.preview.targets.include = [
  "acronyms.md",
  "support/ticket.md",
  "support/get-help/*.md",
  "policies/*",
  "dev-environment/python-environments.md",
  "data-management/filesystem-and-storage/index.md",
  "data-management/data-transfer/using-globus.md",
  "aurora/data-management/lustre/flare.md",
  "account-project-management/MyALCF.md",
  "aurora/running-jobs-aurora.md",
  "polaris/running-jobs/index.md",
]

# Zensical's link checks. --strict fails the build on these.
[project.validation]
invalid_links = true
invalid_link_anchors = true

[project.extra]
homepage = "https://docs.alcf.anl.gov"

[project.extra.analytics]
provider = "google"
property = "G-4M48E2L33R"

# Placed in the overridden footer
[[project.extra.social]]
icon = "fontawesome/brands/github-alt"
link = "https://github.com/argonne-lcf/user-guides"

[[project.extra.social]]
icon = "fontawesome/brands/youtube"
link = "https://www.youtube.com/c/argonneleadershipcomputingfacility"

[[project.extra.social]]
icon = "fontawesome/brands/x-twitter"
link = "https://x.com/argonne_lcf"

[[project.extra.social]]
icon = "fontawesome/brands/facebook"
link = "https://www.facebook.com/argonne.lcf/"

# Not supported by Zensical: MkDocs hooks (hooks/*.py; each file's docstring
# says what it does), and the privacy, group, and optimize plugins.

[project.plugins.search]
# No camelCase split (Material's suggested (?!\b)(?=[A-Z][a-z])): it indexed
# "PyTorch" as "Py" + "Torch", so lowercase queries like "pytorch",
# "tensorflow", "jupyterhub", or "sambanova" missed those pages.
separator = '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;'

[project.plugins.minify]
minify_html = true
# Keep attribute quotes: some link-preview crawlers (e.g. WhatsApp)
# ignore unquoted og:image meta tags from the social plugin.
htmlmin_opts.remove_optional_attribute_quotes = false

# Applies each folder's .meta.yml front matter to every page in that folder
# and below (lists are appended, page values win for scalars). Runs before
# social and tags, which read the merged front matter.
[project.plugins.meta]

# Tags come mostly from folder .meta.yml files. tags_allowed fails the build on
# any other tag (typos, ad hoc tags); search weights tags very heavily, so keep
# the vocabulary small and add to it deliberately.
[project.plugins.tags]
tags_allowed = [
  "Aurora",
  "Polaris",
  "Sophia",
  "Crux",
  "AI Testbed",
  "Cerebras",
  "Graphcore",
  "Groq",
  "SambaNova",
  "Compiling",
  "Containers",
  "Data Science",
  "Debugging",
  "Inference",
  "Performance",
  "Programming Models",
  "Visualization",
  "Workflows",
  "Data Management",
  "Job Submission",
  "Accounts",
  "Policies",
  "Services",
  "Support",
  "Development Environment",
  "Python",
  "PyTorch",
  "TensorFlow",
  "OpenMP",
  "SYCL",
  "Getting Started",
  "LLMs",
  "Distributed Training",
  "File Systems",
  "Globus",
  "File Transfer",
  "Authentication",
  "Kokkos",
