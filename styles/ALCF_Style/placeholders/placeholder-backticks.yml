extends: existence
level: warning
message: "Wrap '%s' in backticks"
nonword: true
scope: raw
tokens:
  - '(?<!`)<[A-Za-z0-9_]+>(?!`)'
tests:
  - name: flags bare placeholder
    input: "Use <username>."
    want: |
      1:5:ALCF_Style.placeholders.placeholder-backticks:Wrap '<username>' in backticks
  - name: allows backticked placeholder
    input: "Use `<username>`."
    want: ''
