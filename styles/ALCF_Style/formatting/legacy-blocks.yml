extends: existence
level: warning
message: "Legacy block syntax (!!!, ???, ===) renders as plain text. Use '///' blocks instead."
nonword: true
scope: raw
tokens:
  - '(?m)^!!!'
  - '(?m)^\?\?\?'
  - '(?m)^===\s+"'
tests:
  - name: flags legacy blocks
    input: "!!! note\nThis is a note."
    want: |
      1:1:ALCF_Style.formatting.legacy-blocks:Legacy block syntax (!!!, ???, ===) renders as plain text. Use '///' blocks instead.
  - name: flags a legacy tab
    input: "=== \"Polaris\"\n    content"
    want: |
      1:1:ALCF_Style.formatting.legacy-blocks:Legacy block syntax (!!!, ???, ===) renders as plain text. Use '///' blocks instead.
  - name: allows new blocks
    input: "/// note\nThis is a note.\n///"
    want: ''
  - name: allows a setext heading underline
    input: "A heading\n=========\n"
    want: ''
