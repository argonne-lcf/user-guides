extends: substitution
level: error
message: "Use '%s' instead of '%s'."
ignorecase: true
scope: summary
swap:
  anaconda: conda/Miniforge
  api: API
  aurora: Aurora
  cmake: CMake
  cpu: CPU
  crux: Crux
  cuda: CUDA
  daos: DAOS
  filesystem: 'file system'
  gcc: GCC
  gdb: GDB
  github: GitHub
  gpu: GPU
  'high performance computing': 'high-performance computing'
  hpc: HPC
  hpss: HPSS
  infiniband: InfiniBand
  jax: JAX
  llvm: LLVM
  lustre: Lustre
  mkl: MKL
  mpi: MPI
  nccl: NCCL
  oneapi: oneAPI
  openmp: OpenMP
  pbs: PBS
  polaris: Polaris
  pytorch: PyTorch
  slingshot: Slingshot
  slurm: Slurm
  sophia: Sophia
  spack: Spack
  sycl: SYCL
  tensorflow: TensorFlow
tests:
  - name: allows correct product name
    input: "Using oneAPI."
    want: ''
  - name: flags wrong keywords for CMake
    input: "Run cmake."
    want: |
      1:5:ALCF_Style.terminology.keywords:Use 'CMake' instead of 'cmake'.
  - name: flags wrong keywords for HPC
    input: "This is hpc."
    want: |
      1:9:ALCF_Style.terminology.keywords:Use 'HPC' instead of 'hpc'.
  - name: flags wrong keywords for SYCL
    input: "Using sycl."
    want: |
      1:7:ALCF_Style.terminology.keywords:Use 'SYCL' instead of 'sycl'.
  - name: flags wrong product name/keyword
    input: "Using Oneapi."
    want: |
      1:7:ALCF_Style.terminology.keywords:Use 'oneAPI' instead of 'Oneapi'.
  - name: allows PBS and Slurm as their owners write them
    input: "Submit with PBS. We run Slurm elsewhere."
    want: ''
  - name: flags the SLURM spelling
    input: "Jobs run under SLURM."
    want: |
      1:16:ALCF_Style.terminology.keywords:Use 'Slurm' instead of 'SLURM'.
  - name: allows conda in prose
    input: "Activate the conda environment."
    want: ''
  - name: flags Anaconda
    input: "Install Anaconda first."
    want: |
      1:9:ALCF_Style.terminology.keywords:Use 'conda/Miniforge' instead of 'Anaconda'.
