# Social card layout for the ALCF User Guides, used by the `social` plugin
# (`cards_layout: alcf` in mkdocs.yml). Based on Material for MkDocs'
# templates/default.yml, with these changes:
#   - the site-name text is replaced by the wide Argonne | ALCF logo used in
#     the site header (overrides/partials/header.html), at its own aspect
#     ratio; the default layout squeezes the logo into a 144x144 square;
#   - the page's nav section path (e.g. "Aurora › Data Science › AI Inference")
#     is shown above the title and added to og:title/twitter:title, since many
#     nav titles repeat across systems ("Getting Started", "Python", "vLLM");
#   - colors and font are fixed to ALCF values, because the theme palette is
#     `custom` and the text font (Proxima Nova) is an Adobe Fonts kit that the
#     plugin can't download from Google Fonts.
# Values can still be overridden via `cards_layout_options` in mkdocs.yml or
# per page under `social:` in front matter.
