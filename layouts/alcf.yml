# -----------------------------------------------------------------------------
# Configuration
# -----------------------------------------------------------------------------

definitions:

  # Background image (default: none), a file name in layouts/backgrounds/.
  # The plugin crops it to cover the card, then paints background_color over
  # it; with an image, the default color below is semi-transparent so the
  # image shows through. Set background_color to "transparent" for an image
  # that is already tinted.
  - &background_image >-
    {%- if layout.background_image -%}
      {{ config.docs_dir ~ "/../layouts/backgrounds/" ~ layout.background_image }}
    {%- endif -%}

  # Background color (default: --blue_med, the site header color; at 85%
  # opacity over a background image, enough for white text to stay readable
  # over the brightest parts of a photo)
  - &background_color >-
    {%- if layout.background_color -%}
      {{ layout.background_color }}
    {%- elif layout.background_image -%}
      #0061AFD9
    {%- else -%}
      #0061AF
    {%- endif -%}

  # Text color
  - &color >-
    {{ layout.color or "#FFFFFF" }}

  # Font family, from Google Fonts (default: Montserrat, a free stand-in for
  # Proxima Nova)
  - &font_family >-
    {{ layout.font_family or "Montserrat" }}

  # Logo: white Argonne | ALCF lockup, 195.62 x 29.73 viewBox (ratio ~6.58)
  - &logo >-
    {{ layout.logo or config.docs_dir ~ "/images/ANL_ALCF-white.svg" }}

  # Page title
  - &page_title >-
    {%- if layout.title -%}
      {{ layout.title }}
    {%- else -%}
      {{ page.meta.get("title", page.title) }}
    {%- endif -%}

  # Nav section path, outermost first, without the top-level "Machines"
  # section that only groups the systems
  - &page_section >-
    {{ page.ancestors | reverse | map(attribute="title")
         | reject("equalto", "Machines") | join(" › ") }}

  # Page title with up to two levels of section path and site name, e.g.
  # "vLLM - Aurora › Data Science - ALCF User Guides"
  - &page_title_with_site_name >-
    {%- if not page.is_homepage -%}
      {%- set section = page.ancestors | reverse | map(attribute="title")
            | reject("equalto", "Machines") | list -%}
      {{ page.meta.get("title", page.title) }}
      {%- if section %} - {{ section[:2] | join(" › ") }}{% endif %}
      {{- " - " ~ config.site_name }}
    {%- else -%}
      {{ config.site_name }}
    {%- endif -%}

  # Page description
  - &page_description >-
    {%- if layout.description -%}
      {{ layout.description }}
    {%- else -%}
      {{ page.meta.get("description", config.site_description) | x }}
    {%- endif -%}

# Meta tags
tags:

  # Open Graph
  og:type: website
  og:site_name: "{{ config.site_name }}"
  og:title: *page_title_with_site_name
  og:description: *page_description
  og:image: "{{ image.url }}"
  og:image:type: "{{ image.type }}"
  og:image:width: "{{ image.width }}"
  og:image:height: "{{ image.height }}"
  og:url: "{{ page.canonical_url }}"

  # Twitter
  twitter:card: summary_large_image
  twitter:title: *page_title_with_site_name
  twitter:description: *page_description
  twitter:image: "{{ image.url }}"

# -----------------------------------------------------------------------------
# Specification
# -----------------------------------------------------------------------------

# Card size and layers
size: { width: 1200, height: 630 }
layers:

  # Background
  - background:
      image: *background_image
      color: *background_color

  # Logo, in place of the default layout's site-name text. The plugin renders
  # SVGs at the layer width and then scales to cover the layer, so the layer
  # must match the logo's aspect ratio (395 / 60 ~ 6.58) or it gets cropped.
  - size: { width: 395, height: 60 }
    offset: { x: 64, y: 56 }
    background:
      image: *logo

  # Section path
  - size: { width: 1072, height: 34 }
    offset: { x: 64, y: 148 }
    typography:
      content: *page_section
      align: start
      color: *color
      line:
        amount: 1
        height: 1.25
      font:
        family: *font_family
        style: Regular

  # Page title, bottom-aligned in its box so it sits right above the
  # description whether it takes one line or three
  - size: { width: 832, height: 290 }
    offset: { x: 62, y: 190 }
    typography:
      content: *page_title
      align: start bottom
      color: *color
      line:
        amount: 3
        height: 1.25
      font:
        family: *font_family
        style: Bold

  # Page description, about 26 px; full width so a 120-character
  # description still fits in two lines
  - size: { width: 1072, height: 78 }
    offset: { x: 64, y: 498 }
    typography:
      content: *page_description
      align: start
      color: *color
      line:
        amount: 2
        height: 1.5
      font:
        family: *font_family
        style: Regular
