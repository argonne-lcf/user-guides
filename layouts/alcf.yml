# -----------------------------------------------------------------------------
# Configuration
# -----------------------------------------------------------------------------

definitions:

  # Background color (default: --blue_med, the site header color)
  - &background_color >-
    {{ layout.background_color or "#0061AF" }}

  # Text color
  - &color >-
    {{ layout.color or "#FFFFFF" }}

  # Font family, from Google Fonts (default: Montserrat, a free stand-in for
  # Proxima Nova)
  - &font_family >-
    {{ layout.font_family or "Montserrat" }}

  # Logo: white Argonne | ALCF lockup, 195.62 x 29.73 viewBox (ratio ~6.58)
  - &logo >-
    {{ layout.logo or config.docs_dir ~ "/images/ANL_ALCF-white.svg" }}

  # Page title
  - &page_title >-
    {%- if layout.title -%}
      {{ layout.title }}
    {%- else -%}
      {{ page.meta.get("title", page.title) }}
    {%- endif -%}

  # Page title with site name
  - &page_title_with_site_name >-
    {%- if not page.is_homepage -%}
      {{ page.meta.get("title", page.title) }} - {{ config.site_name }}
    {%- else -%}
      {{ config.site_name }}
    {%- endif -%}

  # Page description
  - &page_description >-
    {%- if layout.description -%}
      {{ layout.description }}
    {%- else -%}
      {{ page.meta.get("description", config.site_description) | x }}
    {%- endif -%}

# Meta tags
tags:

  # Open Graph
  og:type: website
  og:title: *page_title_with_site_name
  og:description: *page_description
  og:image: "{{ image.url }}"
  og:image:type: "{{ image.type }}"
  og:image:width: "{{ image.width }}"
  og:image:height: "{{ image.height }}"
  og:url: "{{ page.canonical_url }}"

  # Twitter
  twitter:card: summary_large_image
  twitter:title: *page_title_with_site_name
  twitter:description: *page_description
  twitter:image: "{{ image.url }}"

# -----------------------------------------------------------------------------
# Specification
# -----------------------------------------------------------------------------

# Card size and layers
size: { width: 1200, height: 630 }
layers:

  # Background
  - background:
      color: *background_color

  # Logo, in place of the default layout's site-name text. The plugin renders
  # SVGs at the layer width and then scales to cover the layer, so the layer
  # must match the logo's aspect ratio (395 / 60 ~ 6.58) or it gets cropped.
  - size: { width: 395, height: 60 }
    offset: { x: 64, y: 56 }
    background:
      image: *logo

  # Page title
  - size: { width: 832, height: 310 }
    offset: { x: 62, y: 160 }
    typography:
      content: *page_title
      align: start
      color: *color
      line:
        amount: 3
        height: 1.25
      font:
        family: *font_family
        style: Bold

  # Page description
  - size: { width: 832, height: 64 }
    offset: { x: 64, y: 512 }
    typography:
      content: *page_description
      align: start
      color: *color
      line:
        amount: 2
        height: 1.5
      font:
        family: *font_family
        style: Regular
