site_name: ALCF User Guides Preview

docs_dir: docs

nav:
  - Home: index.md

exclude_docs: |
  **/*.md
  !index.md

theme:
  name: material
  custom_dir: overrides
  font:
    text: proxima-nova
  palette:
    - scheme: alcf
      primary: custom
      accent: custom

extra_css:
  - stylesheets/alcf-extra.css

extra_javascript:
  - javascripts/alcf-extra.js

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.snippets:
      base_path: ["."]
      dedent_subsections: true
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
